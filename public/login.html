<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ТехноДом :: Вход в систему</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
    
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            padding: 20px;
        }
        
        .login-card {
            background: #fff;
            border-radius: 15px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            animation: fadeInUp 0.5s ease;
        }
        
        .login-card .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-card .login-logo a {
            text-decoration: none;
            text-transform: uppercase;
            color: var(--accent-color);
            font-size: 28px;
            font-weight: 700;
        }
        
        .login-card .login-logo a:hover {
            color: var(--contrast-color);
        }
        
        .login-card .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: var(--contrast-color);
            font-weight: 500;
        }
        
        .login-card .login-title small {
            color: var(--text-color);
            font-weight: 400;
            display: block;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .login-card .form-control {
            border-radius: 8px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }
        
        .login-card .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(255, 211, 51, 0.25);
        }
        
        .login-card .form-label {
            font-weight: 500;
            color: var(--contrast-color);
        }
        
        .login-card .btn-login {
            background-color: var(--accent-color);
            color: var(--contrast-color);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
            width: 100%;
        }
        
        .login-card .btn-login:hover {
            background-color: #e6b800;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 211, 51, 0.3);
        }
        
        .login-card .btn-login:disabled {
            opacity: 0.6;
            transform: none;
            box-shadow: none;
        }
        
        .login-card .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .login-card .error-message.show {
            display: block;
        }
        
        .login-card .form-group {
            margin-bottom: 20px;
        }
        
        .login-card .input-group-text {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: var(--text-color);
        }
        
        .login-card .form-control-with-icon {
            border-radius: 0 8px 8px 0;
            border-left: none;
        }
        
        .login-card .form-control-with-icon:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(255, 211, 51, 0.25);
        }
        
        .login-card .login-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-color);
            font-size: 14px;
        }
        
        .login-card .login-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-card .login-footer a:hover {
            text-decoration: underline;
        }
        
        .login-card .demo-credentials {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-color);
            border: 1px dashed #dee2e6;
        }
        
        .login-card .demo-credentials strong {
            color: var(--contrast-color);
        }
        
        .login-card .demo-credentials code {
            background: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Стиль для иконки глаза */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            z-index: 10;
            background: none;
            border: none;
            padding: 0;
        }
        
        .toggle-password:hover {
            color: var(--contrast-color);
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper .form-control {
            padding-right: 45px;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <a href="index.html">ТехноДом</a>
            </div>
            
            <div class="login-title">
                <h4>Вход в систему</h4>
                <small>Введите логин и пароль для доступа к заказам</small>
            </div>
            
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="loginUsername" class="form-label">Логин</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control form-control-with-icon" id="loginUsername" 
                               placeholder="Введите логин" value="admin" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword" class="form-label">Пароль</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <div class="password-wrapper flex-grow-1">
                            <input type="password" class="form-control form-control-with-icon" id="loginPassword" 
                                   placeholder="Введите пароль" value="admin123" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                <i class="fa-regular fa-eye" id="passwordIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div id="loginError" class="error-message">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> 
                    Неверный логин или пароль. Попробуйте снова.
                </div>
                
                <button type="submit" class="btn btn-login" id="loginBtn">
                    <span id="loginBtnText"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Войти</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm" style="display: none;" role="status"></span>
                </button>
            </form>
            
            <div class="demo-credentials">
                <strong><i class="fa-regular fa-key me-1"></i> Данные для входа:</strong><br>
                Логин: <code>admin</code> &nbsp;|&nbsp; Пароль: <code>admin123</code>
            </div>
            
            <div class="login-footer">
                <a href="index.html"><i class="fa-solid fa-arrow-left me-1"></i>Вернуться на главную</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // АВТОРИЗАЦИЯ
        // ============================================
        
        // Данные для входа (в реальном проекте хранить на сервере!)
        const VALID_CREDENTIALS = {
            username: 'admin',
            password: 'admin123'
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            // Если пользователь уже авторизован - перенаправляем на страницу заказов
            if (sessionStorage.getItem('isAuthorized') === 'true') {
                window.location.href = 'orders.html';
                return;
            }
            
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');
            
            // Обработка Enter на полях
            document.getElementById('loginUsername').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('loginPassword').focus();
                }
            });
            
            document.getElementById('loginPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            });
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Скрываем предыдущую ошибку
                errorDiv.classList.remove('show');
                
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                
                // Базовая валидация
                if (!username || !password) {
                    showError('Пожалуйста, заполните все поля');
                    return;
                }
                
                // Показываем спиннер
                loginBtn.disabled = true;
                btnText.textContent = 'Вход...';
                spinner.style.display = 'inline-block';
                
                // Имитация задержки запроса к серверу (для реалистичности)
                setTimeout(() => {
                    // Проверка credentials
                    if (username === VALID_CREDENTIALS.username && password === VALID_CREDENTIALS.password) {
                        // Успешный вход
                        sessionStorage.setItem('isAuthorized', 'true');
                        sessionStorage.setItem('username', username);
                        
                        // Перенаправляем на страницу заказов
                        window.location.href = 'orders.html';
                    } else {
                        // Неверные данные
                        showError('Неверный логин или пароль. Попробуйте снова.');
                        loginBtn.disabled = false;
                        btnText.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Войти';
                        spinner.style.display = 'none';
                        
                        // Очищаем поля
                        document.getElementById('loginPassword').value = '';
                        document.getElementById('loginPassword').focus();
                    }
                }, 800);
            });
            
            function showError(message) {
                errorDiv.innerHTML = `<i class="fa-solid fa-circle-exclamation me-1"></i> ${message}`;
                errorDiv.classList.add('show');
                
                // Встряхиваем карточку
                const card = document.querySelector('.login-card');
                card.style.animation = 'none';
                setTimeout(() => {
                    card.style.animation = 'shake 0.5s ease';
                }, 10);
            }
            
            // Добавляем анимацию встряхивания
            const style = document.createElement('style');
            style.textContent = `
                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
                    20%, 40%, 60%, 80% { transform: translateX(10px); }
                }
            `;
            document.head.appendChild(style);
        });
        
        // ============================================
        // ПОКАЗ/СКРЫТИЕ ПАРОЛЯ
        // ============================================
        
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('loginPassword');
            const icon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }
    </script>

</body>

</html>
